name: Build KPM virtouch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install clang lld
        run: |
          sudo apt update
          sudo apt install -y clang lld

      - name: Prepare header folder
        run: |
          mkdir -p kp_inc
          cd kp_inc
          # 下载KPM必须头文件
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/src/kpmodule.h
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/src/hook.h
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/src/syscall.h
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/src/compiler.h
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/src/kputils.h
          ls -la

      - name: Compile KPM
        run: |
          clang --target=aarch64-none-elf -ffreestanding -fno-stack-protector -fno-stack-check -fno-PIC -mno-outline-atomics \
            -I./kp_inc \
            -c virtouch.c -o virtouch.o
          ld.lld -r virtouch.o -o virtouch.kpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtouch-kpm
          path: virtouch.kpm
