name: Build KPM
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64-none-elf-gcc
        uses: lawkai-vivo/aarch64-none-elf-gcc-action@v1

      - name: Clone KernelPatch & build
        run: |
          git clone https://github.com/bmax121/KernelPatch.git kp
          aarch64-none-elf-gcc -ffreestanding -fno-stack-protector -fno-stack-check -fno-PIC -mgeneral-regs-only -Ikp/kernel/patch/include -O2 -Wall -c main.c -o main.o
          aarch64-none-elf-ld -r -nostdlib main.o -o test.kpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm
          path: test.kpm
