name: Build KPM SELinux Bypass
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64-none-elf toolchain
        run: |
          wget https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          mv arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf /opt/toolchain
          echo "/opt/toolchain/bin" >> $GITHUB_PATH
      - name: Download kpm.h
        run: wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/kpms/include/kpm.h
      - name: Compile KPM
        run: |
          aarch64-none-elf-gcc -c -O2 -ffreestanding -fno-stack-protector -fno-PIC -fno-pie -nostdlib -o selinux_bypass.o selinux_bypass.c
          aarch64-none-elf-ld -r -o selinux_bypass.kpm selinux_bypass.o
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: selinux_bypass-kpm
          path: selinux_bypass.kpm
