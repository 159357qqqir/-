name: 编译KPM
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装aarch64交叉编译工具
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 编译KPM
        run: |
          aarch64-linux-gnu-gcc -ffreestanding -mno-red-zone -c main.c -o main.o
          aarch64-linux-gnu-ld -r main.o -o my.kpm
          aarch64-linux-gnu-objcopy --strip-all my.kpm

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: 编译结果
          path: my.kpm
