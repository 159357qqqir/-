name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download KernelPatch source
        run: |
          git clone https://github.com/bmax121/KernelPatch.git kp

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y make

      - name: Setup ARM GCC Toolchain
        uses: ARM-software/setup-arm-gnu-toolchain@v1
        with:
          version: "13.3.Rel1"
          target: aarch64-none-elf

      - name: Compile KPM
        run: |
          make
          ls *.kpm

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm-module
          path: "*.kpm"
