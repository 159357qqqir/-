name: Build OS Kernel
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y gcc nasm make binutils
      - name: Compile
        run: make
      - name: Upload kernel.bin
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel.bin

