name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install aarch64-none-elf toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-none-elf binutils-aarch64-none-elf

      - name: Fetch KernelPatch kpm.h + kpm.ld
        run: |
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/kpm/include/kpm.h -O kpm.h
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/kpm/link/kpm.ld -O kpm.ld

      - name: Build
        run: make -j$(nproc)

      - name: Upload artifact (demo.kpm)
        uses: actions/upload-artifact@v4
        with:
          name: simple-kpm
          path: build/demo.kpm
