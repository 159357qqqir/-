name: Build KPM virtouch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-none-elf binutils-aarch64-none-elf make git

      - name: Fetch KernelPatch
        run: git clone https://github.com/bmax121/KernelPatch.git

      - name: Compile KPM
        run: make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: virtouch-kpm
          path: virtouch.kpm
