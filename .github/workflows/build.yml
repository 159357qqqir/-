name: Build KPM
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download kptools-linux 0.13.9
        run: |
          wget https://github.com/bmax121/KernelPatch/releases/download/v0.13.9/kptools-linux
          chmod +x ./kptools-linux

      - name: Compile kpm
        run: |
          ./kptools-linux build dump_func.c

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dump_func-kpm
          path: dump_func.kpm
