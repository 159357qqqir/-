name: Build KPM virtouch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget tar make

      - name: Download aarch64-none-elf gcc
        run: |
          wget https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-aarch64-none-elf-x86_64-linux-gnu.tar.xz
          tar -Jxvf arm-gnu-toolchain-13.2.rel1-aarch64-none-elf-x86_64-linux-gnu.tar.xz
          echo "$PWD/arm-gnu-toolchain-13.2.rel1-aarch64-none-elf-x86_64-linux-gnu/bin" >> $GITHUB_PATH

      - name: Clone KernelPatch for kpm.h
        run: git clone https://github.com/bmax121/KernelPatch.git

      - name: Build
        run: |
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtouch-kpm
          path: virtouch.kpm
