name: Build KPM virtouch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install clang + lld
        run: |
          sudo apt update
          sudo apt install -y clang lld

      - name: Clone full KernelPatch
        run: git clone https://github.com/bmax121/KernelPatch.git

      - name: Debug check headers
        run: |
          export KP_ROOT=$PWD/KernelPatch
          ls ${KP_ROOT}/kernel/patch/include/uapi

      - name: Compile KPM
        run: |
          export KP_ROOT=$PWD/KernelPatch
          clang --target=aarch64-linux-gnu \
            -ffreestanding -fno-stack-protector -fno-stack-check -fno-PIC -mno-outline-atomics \
            -I${KP_ROOT}/kernel/include \
            -I${KP_ROOT}/kernel/patch/include \
            -c virtouch.c -o virtouch.o
          ld.lld -r virtouch.o -o virtouch.kpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtouch-kpm
          path: virtouch.kpm
