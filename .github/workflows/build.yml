name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download KernelPatch source
        run: |
          git clone https://github.com/bmax121/KernelPatch.git kp

      - name: Install dependencies + xpm
        run: |
          sudo apt update
          sudo apt install -y make
          npm install -g xpm

      - name: Install aarch64-none-elf-gcc (xPack)
        run: |
          xpm install @xpack-dev-tools/aarch64-none-elf-gcc@latest --global
          echo "$(xpm exec --which aarch64-none-elf-gcc | xargs dirname)" >> $GITHUB_PATH

      - name: Compile KPM
        run: |
          make
          ls *.kpm

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm-module
          path: "*.kpm"
