name: Build nb (Termux aarch64 static)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compile toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu git make autoconf automake libtool pkg-config

      - name: Compile libmnl
        run: |
          git clone https://git.netfilter.org/libmnl
          cd libmnl
          ./autogen.sh
          ./configure --host=aarch64-linux-gnu --prefix=$PWD/out --enable-static --disable-shared
          make -j$(nproc)
          make install

      - name: Compile libnfnetlink
        run: |
          git clone https://git.netfilter.org/libnfnetlink
          cd libnfnetlink
          ./autogen.sh
          ./configure --host=aarch64-linux-gnu --prefix=$PWD/out --enable-static --disable-shared
          make -j$(nproc)
          make install

      - name: Compile libnetfilter_queue
        run: |
          git clone https://git.netfilter.org/libnetfilter_queue
          cd libnetfilter_queue
          export PKG_CONFIG_PATH="../libmnl/out/lib/pkgconfig:../libnfnetlink/out/lib/pkgconfig"
          ./autogen.sh
          ./configure --host=aarch64-linux-gnu --prefix=$PWD/out --enable-static --disable-shared
          make -j$(nproc)
          make install

      - name: Build static nb
        run: |
          export LIBMNL=$(pwd)/libmnl/out
          export LIBNFNL=$(pwd)/libnfnetlink/out
          export LIBNFQ=$(pwd)/libnetfilter_queue/out
          aarch64-linux-gnu-gcc -static nb.c -o nb \
            -I$LIBNFQ/include -I$LIBMNL/include -I$LIBNFNL/include \
            -L$LIBNFQ/lib -L$LIBMNL/lib -L$LIBNFNL/lib \
            -lnetfilter_queue -lnfnetlink -lmnl

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nb-termux-aarch64
          path: nb
