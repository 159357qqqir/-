name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download ARM official aarch64-none-elf toolchain
        run: |
          wget https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -xf arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf.tar.xz
          echo "$PWD/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf/bin" >> $GITHUB_PATH

      - name: Fetch KernelPatch kpm.h + kpm.ld
        run: |
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/kpm/include/kpm.h -O kpm.h
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/kpm/link/kpm.ld -O kpm.ld

      - name: Build
        run: make -j$(nproc)

      - name: Upload artifact (demo.kpm)
        uses: actions/upload-artifact@v4
        with:
          name: simple-kpm
          path: build/demo.kpm
