name: Build KPM virtouch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install clang lld
        run: |
          sudo apt update
          sudo apt install -y clang lld

      - name: Clone APatch（这里才有kpms！）
        run: git clone --depth=1 https://github.com/bmax121/APatch.git

      - name: Debug list headers
        run: |
          export AP_ROOT=$PWD/APatch
          ls -la ${AP_ROOT}/kpms/include

      - name: Compile KPM
        run: |
          export AP_ROOT=$PWD/APatch
          clang --target=aarch64-none-elf -ffreestanding -fno-stack-protector -fno-stack-check -fno-PIC -mno-outline-atomics \
            -I${AP_ROOT}/kpms/include \
            -c virtouch.c -o virtouch.o
          ld.lld -r virtouch.o -o virtouch.kpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtouch-kpm
          path: virtouch.kpm
