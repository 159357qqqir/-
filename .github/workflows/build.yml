name: Build KPM virtouch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install aarch64-none-elf toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-none-elf clang lld

      - name: Clone full KernelPatch
        run: git clone https://github.com/bmax121/KernelPatch.git

      - name: Compile KPM (same as official demo Makefile)
        run: |
          export KP_ROOT=$PWD/KernelPatch
          export CROSS=aarch64-none-elf-
          ${CROSS}clang --target=aarch64-none-elf \
            -ffreestanding -fno-stack-protector -fno-stack-check -fno-PIC -mno-outline-atomics \
            -I${KP_ROOT}/kernel/include \
            -c virtouch.c -o virtouch.o
          ${CROSS}ld.lld -r virtouch.o -o virtouch.kpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtouch-kpm
          path: virtouch.kpm
