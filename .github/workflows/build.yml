name: Build KPM
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 加上这个！就能手动点按钮跑

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64-none-elf gcc
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-none-elf binutils-aarch64-none-elf
      - name: make
        run: make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module.kpm
          path: build/module.kpm
