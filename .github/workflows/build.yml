name: Build KPM
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: lawkai-vivo/aarch64-none-elf-gcc-action@v1

      - name: Download KPM headers
        run: |
          mkdir -p kp_sdk/include
          cd kp_sdk/include
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/kernel/include/kpmodule.h
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/kernel/include/compiler.h
          wget https://raw.githubusercontent.com/bmax121/KernelPatch/main/kernel/include/kputils.h
          ls -la
          cd ../..
          ls -la

      - name: Build
        run: make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kpm
          path: "*.kpm"
