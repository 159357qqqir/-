name: Build SELinuxPerm LKM
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android14-6.1 GKI DDK
        uses: droid-actions/ddk@v1
        with:
          tag: android14-6.1
          arch: aarch64

      - name: Build kernel module
        run: |
          cd src
          make -j$(nproc)

      - name: Copy ko 到模块根目录
        run: |
          cp src/selinux_perm.ko ./selinux_perm.ko

      - name: 打包Magisk模块zip
        run: |
          zip -r selinux_perm.zip . \
          -x ".git/*" \
          -x ".github/*" \
          -x "src/*.o" \
          -x "src/*.mod.c" \
          -x "src/*.mod" \
          -x "src/modules.order" \
          -x "src/modules.builtin" \
          -x "src/.cache/*"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: selinux_perm_module
          path: selinux_perm.zip
