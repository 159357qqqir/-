name: Build MyOS ISO
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译 + grub打包依赖
        run: sudo apt update && sudo apt install -y gcc nasm make binutils grub-pc grub-common xorriso

      - name: 编译并生成ISO
        run: make os.iso

      - name: 上传ISO镜像
        uses: actions/upload-artifact@v4
        with:
          name: os-iso
          path: os.iso
