name: 编译KPM
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装交叉编译器
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-none-elf binutils-aarch64-none-elf

      - name: 生成 kpm.h
        run: |
          cat > kpm.h <<'HEADER'
#ifndef __KPM_H
#define __KPM_H
#include <stdint.h>
#include <stddef.h>

#define KPM_NAME(x)     const char *__kpm_name __attribute__((used,section(".kpm.name"))) = x
#define KPM_VERSION(x)  const char *__kpm_version __attribute__((used,section(".kpm.version"))) = x
#define KPM_LICENSE(x)  const char *__kpm_license __attribute__((used,section(".kpm.license"))) = x

#define KPM_INIT  __attribute__((used,section(".kpm.init")))
#define KPM_EXIT  __attribute__((used,section(".kpm.exit")))
#endif
HEADER

      - name: 生成 main.c
        run: |
          cat > main.c <<'SRC'
#include "kpm.h"

KPM_NAME("my_kpm");
KPM_VERSION("1.0");
KPM_LICENSE("GPL");

KPM_INIT
int __kpm_init(void)
{
    return 0;
}

KPM_EXIT
void __kpm_exit(void)
{
}
SRC

      - name: 编译
        run: |
          aarch64-none-elf-gcc -ffreestanding -mno-red-zone -c main.c -o main.o
          aarch64-none-elf-ld -r main.o -o my.kpm
          aarch64-none-elf-objcopy --strip-all my.kpm

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: 编译结果
          path: my.kpm
