name: Build KPM
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download KernelPatch source
        run: |
          git clone https://github.com/bmax121/KernelPatch.git kp

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y make wget tar

      - name: Download aarch64-none-elf toolchain
        run: |
          wget https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -xf arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf.tar.xz
          mv arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf gcc-arm
          echo "${PWD}/gcc-arm/bin" >> $GITHUB_PATH

      - name: Compile KPM
        run: |
          make
          ls *.kpm

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm-module
          path: "*.kpm"
