name: Build MyOS ISO
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装全部依赖（补上 grub-pc-bin mtools）
        run: sudo apt update && sudo apt install -y gcc nasm make binutils grub-pc grub-common grub-pc-bin xorriso mtools

      - name: 编译打包ISO
        run: make os.iso

      - name: 上传ISO镜像
        uses: actions/upload-artifact@v4
        with:
          name: os-iso镜像
          path: os.iso
