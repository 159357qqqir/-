name: Build KPM Module

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 ARM64 交叉编译工具链
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # 兼容 aarch64-none-elf 命名
          sudo ln -s /usr/bin/aarch64-linux-gnu-gcc /usr/bin/aarch64-none-elf-gcc
          sudo ln -s /usr/bin/aarch64-linux-gnu-ld /usr/bin/aarch64-none-elf-ld
          sudo ln -s /usr/bin/aarch64-linux-gnu-objcopy /usr/bin/aarch64-none-elf-objcopy

      - name: 克隆 KernelPatch 头文件
        run: |
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git

      - name: 编译 KPM 模块
        run: |
          make KP_DIR=KernelPatch

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kpm-hello-demo
          path: kpm-hello-demo.kpm
