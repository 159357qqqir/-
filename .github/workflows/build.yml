name: Build KPM virtouch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt update
          sudo apt install -y git make cmake gcc g++

      - name: Clone KernelPatch
        run: git clone https://github.com/bmax121/KernelPatch.git

      - name: Build kptools
        run: |
          cd KernelPatch/kptools
          cmake -B build
          cmake --build build
          echo "$PWD/build" >> $GITHUB_PATH

      - name: Build virtouch.kpm
        run: |
          kpm-build --arch aarch64 virtouch.c -o virtouch.kpm

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: virtouch-kpm
          path: virtouch.kpm
