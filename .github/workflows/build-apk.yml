name: Build Camera APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Empty Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 开启 Gradle 缓存，加速编译，避免像上次跑半小时
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 1. 拉取 Google 官方相机示例项目 (包含完整的拍照、预览、权限申请)
      - name: Clone Official Camera Project
        run: |
          echo "正在下载 Google 官方 CameraX 源码..."
          git clone https://github.com/android/camera-samples.git my-camera-app
        
      # 2. 魔法步骤：进入相机模块，修改字符串实现汉化
      - name: Force Chinese Localization
        run: |
          cd my-camera-app/CameraXBasic/app/src/main/res/values/
          echo "开始汉化 App..."
          # 修改 App 名称
          sed -i 's/>CameraXBasic</>官方相机(汉化版)</g' strings.xml
          # 修改拍照按钮提示
          sed -i 's/>Take Picture</>点击拍照</g' strings.xml
          # 修改权限提示文本 (如果有)
          sed -i 's/>Permissions</>需要权限</g' strings.xml
          echo "汉化完成！"

      # 3. 编译 APK
      - name: Build Debug APK
        run: |
          # 进入相机的具体子项目目录
          cd my-camera-app/CameraXBasic
          chmod +x gradlew
          echo "开始编译 APK..."
          ./gradlew assembleDebug

      # 4. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-App-APK
          # 提取编译好的 APK
          path: my-camera-app/CameraXBasic/app/build/outputs/apk/debug/*.apk
