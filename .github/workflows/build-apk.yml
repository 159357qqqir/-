name: Build APK from Empty Repo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Empty Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 魔法步骤：从官方拉取一个现成的 Android Hello World 项目
      - name: Clone Official Android Project
        run: |
          echo "正在下载开源 Android 项目源码..."
          # 下载官方的 Android 架构示例项目
          git clone https://github.com/android/architecture-samples.git my-app
        
      - name: Build Debug APK
        run: |
          echo "进入项目目录并开始编译..."
          cd my-app
          # 赋予编译脚本执行权限
          chmod +x gradlew
          # 执行编译
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Official-Sample-APK
          # 找到编译好的 APK 并上传
          path: my-app/app/build/outputs/apk/debug/*.apk
