name: Auto Build My Calculator

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Generate Source Code & Inject Icon
        run: |
          echo "正在从零创建计算器..."
          mkdir -p app/src/main/java/com/my/calculator
          mkdir -p app/src/main/res/drawable
          
          # 1. 写项目配置
          echo 'rootProject.name = "MyCalculator"
          include ":app"' > settings.gradle
          
          echo 'apply plugin: "com.android.application"
          android {
              namespace "com.my.calculator"
              compileSdk 33
              defaultConfig {
                  applicationId "com.my.calculator"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }' > app/build.gradle
          
          # 🚀 2. 终极智能抓图逻辑
          # 在根目录找任何以 png/jpg/jpeg 结尾的文件，排除 .github 目录
          IMG_FILE=$(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | head -n 1)
          
          if [ -n "$IMG_FILE" ]; then
            echo "✅ 成功捕捉到图片: $IMG_FILE，正在设为图标..."
            cp "$IMG_FILE" app/src/main/res/drawable/my_custom_logo.png
            ICON_NAME="@drawable/my_custom_logo"
          else
            echo "⚠️ 没找到任何图片，只能使用默认的代码图标了..."
            # 如果没有图片，画一个默认的（省略之前的代码，这里直接给一个极简的）
            echo '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#3F51B5"/></shape>' > app/src/main/res/drawable/my_custom_logo.png
            ICON_NAME="@drawable/my_custom_logo"
          fi

          # 3. 写安卓清单文件 (绑定找到的图片)
          echo "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <application android:label=\"专属计算器\" android:icon=\"$ICON_NAME\" android:theme=\"@android:style/Theme.Material.Light.NoActionBar\">
                  <activity android:name=\".MainActivity\" android:exported=\"true\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MAIN\" />
                          <category android:name=\"android.intent.category.LAUNCHER\" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>" > app/src/main/AndroidManifest.xml

          # 4. 写 Java 核心代码
          cat > app/src/main/java/com/my/calculator/MainActivity.java << 'EOF'
          package com.my.calculator;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.text.DecimalFormat;

          public class MainActivity extends Activity {
              private TextView display;
              private String currentInput = "";
              private String operator = "";
              private double firstOperand = 0;
              private boolean isNewInput = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout mainLayout = new LinearLayout(this);
                  mainLayout.setOrientation(LinearLayout.VERTICAL);
                  mainLayout.setPadding(32, 32, 32, 32);
                  display = new TextView(this);
                  display.setTextSize(48);
                  display.setGravity(Gravity.END);
                  display.setText("0");
                  LinearLayout.LayoutParams displayParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1);
                  display.setLayoutParams(displayParams);
                  mainLayout.addView(display);
                  GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(4); grid.setRowCount(5);
                  LinearLayout.LayoutParams gridParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 3);
                  grid.setLayoutParams(gridParams);
                  String[] buttons = {"C", "±", "%", "÷", "7", "8", "9", "×", "4", "5", "6", "-", "1", "2", "3", "+", "0", ".", "←", "="};
                  for (int i = 0; i < buttons.length; i++) {
                      final String text = buttons[i];
                      Button btn = new Button(this);
                      btn.setText(text); btn.setTextSize(24);
                      GridLayout.LayoutParams params = new GridLayout.LayoutParams();
                      params.columnSpec = GridLayout.spec(i % 4, 1f);
                      params.rowSpec = GridLayout.spec(i / 4, 1f);
                      params.width = 0; params.height = 0;
                      params.setMargins(8, 8, 8, 8);
                      btn.setLayoutParams(params);
                      btn.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { handleButton(text); }
                      });
                      grid.addView(btn);
                  }
                  mainLayout.addView(grid);
                  setContentView(mainLayout);
              }
              private void handleButton(String text) {
                  try {
                      if (text.matches("[0-9]")) {
                          if (isNewInput) { currentInput = text; isNewInput = false; }
                          else { currentInput += text; }
                          display.setText(currentInput);
                      } else if (text.equals(".")) {
                          if (!currentInput.contains(".")) { currentInput += "."; display.setText(currentInput); }
                      } else if (text.equals("C")) {
                          currentInput = ""; firstOperand = 0; operator = ""; display.setText("0"); isNewInput = true;
                      } else if (text.equals("←")) {
                          if (currentInput.length() > 0) {
                              currentInput = currentInput.substring(0, currentInput.length() - 1);
                              display.setText(currentInput.isEmpty() ? "0" : currentInput);
                          }
                      } else if (text.equals("±")) {
                          if (!currentInput.isEmpty() && !currentInput.equals("0")) {
                              if (currentInput.startsWith("-")) currentInput = currentInput.substring(1);
                              else currentInput = "-" + currentInput;
                              display.setText(currentInput);
                          }
                      } else if (text.equals("%")) {
                          if (!currentInput.isEmpty()) {
                              double val = Double.parseDouble(currentInput) / 100;
                              currentInput = new DecimalFormat("#.########").format(val);
                              display.setText(currentInput);
                          }
                      } else if (text.equals("+") || text.equals("-") || text.equals("×") || text.equals("÷")) {
                          if (!currentInput.isEmpty()) {
                              if (!operator.isEmpty()) calculate();
                              else firstOperand = Double.parseDouble(currentInput);
                              operator = text; isNewInput = true;
                          }
                      } else if (text.equals("=")) {
                          calculate(); operator = ""; isNewInput = true;
                      }
                  } catch (Exception e) { display.setText("错误"); currentInput = ""; operator = ""; isNewInput = true; }
              }
              private void calculate() {
                  if (operator.isEmpty() || currentInput.isEmpty()) return;
                  double secondOperand = Double.parseDouble(currentInput);
                  double result = 0;
                  switch (operator) {
                      case "+": result = firstOperand + secondOperand; break;
                      case "-": result = firstOperand - secondOperand; break;
                      case "×": result = firstOperand * secondOperand; break;
                      case "÷": if (secondOperand != 0) result = firstOperand / secondOperand;
                          else { display.setText("不能除以0"); currentInput=""; operator=""; return; } break;
                  }
                  String resultStr = new DecimalFormat("#.########").format(result);
                  display.setText(resultStr); currentInput = resultStr; firstOperand = result;
              }
          }
          EOF
          
          echo "✅ 源码与图标注入完毕！"

      - name: Auto Test & Build APK
        run: |
          COMBOS=("8.2.2:8.2" "8.3.0:8.4" "8.4.0:8.6")
          SUCCESS=false
          for combo in "${COMBOS[@]}"; do
            AGP="${combo%%:*}"; GRADLE="${combo##*:}"
            echo "⏳ 测试: AGP $AGP + Gradle $GRADLE"
            echo "buildscript {
                repositories { google(); mavenCentral() }
                dependencies { classpath 'com.android.tools.build:gradle:$AGP' }
            }
            allprojects { repositories { google(); mavenCentral() } }" > build.gradle
            wget -q https://services.gradle.org/distributions/gradle-${GRADLE}-bin.zip
            unzip -q gradle-${GRADLE}-bin.zip
            export ANDROID_HOME=$ANDROID_SDK_ROOT
            ./gradle-${GRADLE}/bin/gradle assembleDebug --no-daemon
            if [ $? -eq 0 ]; then
              echo "🎉 成功: AGP $AGP + Gradle $GRADLE"
              SUCCESS=true; break
            else
              rm -rf gradle-${GRADLE}; rm -rf ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build
            fi
          done
          if [ "$SUCCESS" = false ]; then exit 1; fi

      - name: Upload My Own APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: My-Own-Calculator-APK
          path: app/build/outputs/apk/debug/*.apk
