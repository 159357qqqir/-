name: Auto Build My Calculator

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Empty Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 缓存下载的 Gradle 包，加快循环测试速度
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 🚀 第一步：纯手搓生成所有源码文件
      - name: Generate Calculator Source Code
        run: |
          echo "正在从零创建专属计算器..."
          mkdir -p app/src/main/java/com/my/calculator
          
          # 1. 写项目配置
          echo 'rootProject.name = "MyCalculator"
          include ":app"' > settings.gradle
          
          # 2. 写 App 配置 (compileSdk 升到 34 以兼容新版插件)
          echo 'apply plugin: "com.android.application"
          android {
              namespace "com.my.calculator"
              compileSdk 34
              defaultConfig {
                  applicationId "com.my.calculator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }' > app/build.gradle
          
          # 3. 写安卓清单文件
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="专属计算器" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > app/src/main/AndroidManifest.xml

          # 4. 写 Java 核心代码 (纯手搓的全能计算器逻辑)
          cat > app/src/main/java/com/my/calculator/MainActivity.java << 'EOF'
          package com.my.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.text.DecimalFormat;

          public class MainActivity extends Activity {
              private TextView display;
              private String currentInput = "";
              private String operator = "";
              private double firstOperand = 0;
              private boolean isNewInput = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout mainLayout = new LinearLayout(this);
                  mainLayout.setOrientation(LinearLayout.VERTICAL);
                  mainLayout.setPadding(32, 32, 32, 32);

                  display = new TextView(this);
                  display.setTextSize(48);
                  display.setGravity(Gravity.END);
                  display.setText("0");
                  LinearLayout.LayoutParams displayParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1);
                  display.setLayoutParams(displayParams);
                  mainLayout.addView(display);

                  GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(4);
                  grid.setRowCount(5);
                  LinearLayout.LayoutParams gridParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 3);
                  grid.setLayoutParams(gridParams);

                  String[] buttons = {
                          "C", "±", "%", "÷",
                          "7", "8", "9", "×",
                          "4", "5", "6", "-",
                          "1", "2", "3", "+",
                          "0", ".", "←", "="
                  };

                  for (int i = 0; i < buttons.length; i++) {
                      final String text = buttons[i];
                      Button btn = new Button(this);
                      btn.setText(text);
                      btn.setTextSize(24);
                      GridLayout.LayoutParams params = new GridLayout.LayoutParams();
                      params.columnSpec = GridLayout.spec(i % 4, 1f);
                      params.rowSpec = GridLayout.spec(i / 4, 1f);
                      params.width = 0;
                      params.height = 0;
                      params.setMargins(8, 8, 8, 8);
                      btn.setLayoutParams(params);

                      btn.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              handleButton(text);
                          }
                      });
                      grid.addView(btn);
                  }
                  mainLayout.addView(grid);
                  setContentView(mainLayout);
              }

              private void handleButton(String text) {
                  try {
                      if (text.matches("[0-9]")) {
                          if (isNewInput) { currentInput = text; isNewInput = false; }
                          else { currentInput += text; }
                          display.setText(currentInput);
                      } else if (text.equals(".")) {
                          if (!currentInput.contains(".")) {
                              currentInput += ".";
                              display.setText(currentInput);
                          }
                      } else if (text.equals("C")) {
                          currentInput = ""; firstOperand = 0; operator = "";
                          display.setText("0"); isNewInput = true;
                      } else if (text.equals("←")) {
                          if (currentInput.length() > 0) {
                              currentInput = currentInput.substring(0, currentInput.length() - 1);
                              display.setText(currentInput.isEmpty() ? "0" : currentInput);
                          }
                      } else if (text.equals("±")) {
                          if (!currentInput.isEmpty() && !currentInput.equals("0")) {
                              if (currentInput.startsWith("-")) currentInput = currentInput.substring(1);
                              else currentInput = "-" + currentInput;
                              display.setText(currentInput);
                          }
                      } else if (text.equals("%")) {
                          if (!currentInput.isEmpty()) {
                              double val = Double.parseDouble(currentInput) / 100;
                              currentInput = new DecimalFormat("#.########").format(val);
                              display.setText(currentInput);
                          }
                      } else if (text.equals("+") || text.equals("-") || text.equals("×") || text.equals("÷")) {
                          if (!currentInput.isEmpty()) {
                              if (!operator.isEmpty()) calculate();
                              else firstOperand = Double.parseDouble(currentInput);
                              operator = text;
                              isNewInput = true;
                          }
                      } else if (text.equals("=")) {
                          calculate();
                          operator = "";
                          isNewInput = true;
                      }
                  } catch (Exception e) {
                      display.setText("错误");
                      currentInput = ""; operator = ""; isNewInput = true;
                  }
              }

              private void calculate() {
                  if (operator.isEmpty() || currentInput.isEmpty()) return;
                  double secondOperand = Double.parseDouble(currentInput);
                  double result = 0;
                  switch (operator) {
                      case "+": result = firstOperand + secondOperand; break;
                      case "-": result = firstOperand - secondOperand; break;
                      case "×": result = firstOperand * secondOperand; break;
                      case "÷": 
                          if (secondOperand != 0) result = firstOperand / secondOperand;
                          else { display.setText("不能除以0"); currentInput=""; operator=""; return; }
                          break;
                  }
                  String resultStr = new DecimalFormat("#.########").format(result);
                  display.setText(resultStr);
                  currentInput = resultStr;
                  firstOperand = result;
              }
          }
          EOF
          
          echo "✅ 源码凭空捏造完毕！"

      # 🔄 第二步：全自动循环测试版本组合
      - name: Auto Test & Build APK
        run: |
          # 定义测试矩阵 (AGP:Gradle)
          COMBOS=("8.2.2:8.2" "8.3.0:8.4" "8.4.0:8.6" "8.5.0:8.7")
          SUCCESS=false
          
          for combo in "${COMBOS[@]}"; do
            AGP="${combo%%:*}"
            GRADLE="${combo##*:}"
            
            echo "======================================"
            echo "⏳ 自动测试组合: AGP $AGP + Gradle $GRADLE"
            echo "======================================"
            
            # 【核心防暴毙技巧】：先把 build.gradle 清空，防止系统默认的 Gradle 提前解析报错
            echo "" > build.gradle
            
            # 生成对应版本的 Gradle Wrapper
            gradle wrapper --gradle-version $GRADLE > /dev/null 2>&1 || true
            
            # 重新写入真正的 AGP 依赖配置
            echo "buildscript {
                repositories { google(); mavenCentral() }
                dependencies { classpath 'com.android.tools.build:gradle:$AGP' }
            }
            allprojects { repositories { google(); mavenCentral() } }" > build.gradle
            
            # 赋予权限并开始编译
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            
            # 检查编译是否成功 (退出码是否为 0)
            if [ $? -eq 0 ]; then
              echo "🎉 🎉 🎉 编译成功！最终使用的组合是: AGP $AGP + Gradle $GRADLE"
              SUCCESS=true
              break
            else
              echo "❌ 组合失败，清理现场，准备尝试下一个..."
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ 所有测试的版本组合均失败，请检查代码。"
            exit 1
          fi

      # 第三步：下载编译成功的 APK
      - name: Upload My Own APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: My-Own-Calculator-APK
          path: app/build/outputs/apk/debug/*.apk
