steps:
  # 1. 先 checkout 代码
  - uses: actions/checkout@v4

  # 2. 添加 Azure 登录步骤
  - name: 'Azure Login'
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.AZURE_CLIENT_ID }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # 3. 再执行部署
  - name: 'Deploy to Azure Web App'
    uses: azure/webapps-deploy@v2
    with:
      app-name: '你的应用名称'
      package: '.'
