name: Build Chinese Camera APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Empty Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 1. 获取官方相机项目
      - name: Download Camera Project
        run: |
          git clone https://github.com/android/camera-samples.git my-project

      # 2. 智能汉化：全局搜索文本，找到就替换，找不到也不报错
      - name: Smart Localization
        run: |
          cd my-project
          echo "正在搜索需要汉化的文件..."
          STRINGS_FILE=$(find . -name "strings.xml" | head -n 1)
          
          if [ -n "$STRINGS_FILE" ]; then
            echo "✅ 找到语言文件: $STRINGS_FILE"
            # 强制修改 App 名字为中文
            sed -i 's/>CameraXBasic</>中文相机</g' $STRINGS_FILE
            sed -i 's/>Take Picture</>拍照</g' $STRINGS_FILE
          else
            echo "⚠️ 没有找到 strings.xml，跳过汉化步骤。"
          fi

      # 3. 智能编译：自动寻找 Gradle 脚本并编译
      - name: Build APK
        run: |
          cd my-project
          # 自动寻找真正的 Gradle 项目入口
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          WORK_DIR=$(dirname "$GRADLEW_PATH")
          
          echo "✅ 找到编译目录: $WORK_DIR"
          cd "$WORK_DIR"
          chmod +x gradlew
          
          echo "开始编译，请耐心等待..."
          ./gradlew assembleDebug

      # 4. 提取 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-App
          path: my-project/**/build/outputs/apk/debug/*.apk
