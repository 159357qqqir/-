name: Build MT Terminal APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 下载并解压独立的 Gradle 8.5 (彻底避开系统预装的高版本冲突)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          chmod +x gradle-8.5/bin/gradle

      - name: 一键生成纯源码项目
        run: |
          # 1. 创建目录结构
          mkdir -p app/src/main/java/com/mt/term
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 2. 写入 settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MTTerm"
          include ':app'
          EOF

          # 3. 写入 build.gradle (根)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          # 4. 写入 gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          # 5. 写入 app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mt.term'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mt.term"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          # 6. 写入 AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="MT终端"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. 写入 layout/activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#111111"
              android:padding="6dp">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  <Button android:id="@+id/btnRoot" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Root" />
                  <Button android:id="@+id/btnSh" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="普通Shell" />
                  <Button android:id="@+id/btnClear" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="清屏" />
              </LinearLayout>
              <ScrollView
                  android:id="@+id/scroll"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="#000000">
                  <TextView
                      android:id="@+id/output"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:padding="8dp"
                      android:fontFamily="monospace"
                      android:textColor="#00FF66"
                      android:textSize="13sp"
                      android:textIsSelectable="true" />
              </ScrollView>
              <EditText
                  android:id="@+id/input"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="输入命令后回车"
                  android:padding="10dp"
                  android:background="#1E1E1E"
                  android:fontFamily="monospace"
                  android:textColor="#FFFFFF"
                  android:textColorHint="#777777"
                  android:textSize="14sp"
                  android:singleLine="true"
                  android:imeOptions="actionSend"
                  android:inputType="text" />
          </LinearLayout>
          EOF

          # 8. 写入 TerminalSession.java
          cat << 'EOF' > app/src/main/java/com/mt/term/TerminalSession.java
          package com.mt.term;
          import android.os.Handler;
          import android.os.Looper;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class TerminalSession {
              public interface Listener {
                  void onOutput(String text);
                  void onSessionEnd();
              }
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final Listener listener;
              private Process process;
              private OutputStream stdin;
              private Thread reader;
              private volatile boolean running = false;

              public TerminalSession(Listener listener) {
                  this.listener = listener;
              }

              public boolean start(boolean root) {
                  if (running) stop();
                  try {
                      ProcessBuilder pb = new ProcessBuilder(root ? "su" : "/system/bin/sh");
                      pb.redirectErrorStream(true);
                      process = pb.start();
                      stdin = process.getOutputStream();
                      running = true;
                      final InputStream out = process.getInputStream();
                      reader = new Thread(() -> {
                          byte[] buf = new byte[4096];
                          try {
                              int n;
                              while (running && (n = out.read(buf)) != -1) {
                                  final String s = new String(buf, 0, n, "UTF-8");
                                  mainHandler.post(() -> { if (running) listener.onOutput(s); });
                              }
                          } catch (IOException ignored) {
                          } finally {
                              if (running) {
                                  running = false;
                                  mainHandler.post(listener::onSessionEnd);
                              }
                          }
                      }, "term-reader");
                      reader.setDaemon(true);
                      reader.start();
                      return true;
                  } catch (IOException e) {
                      listener.onOutput("启动失败: " + e.getMessage() + "\n");
                      return false;
                  }
              }

              public void write(String data) {
                  if (stdin == null || !running) {
                      listener.onOutput("会话已结束\n");
                      return;
                  }
                  try {
                      stdin.write(data.getBytes("UTF-8"));
                      stdin.flush();
                  } catch (IOException e) {
                      listener.onOutput("写入失败: " + e.getMessage() + "\n");
                  }
              }

              public void stop() {
                  running = false;
                  try { if (stdin != null) stdin.close(); } catch (IOException ignored) {}
                  if (process != null) process.destroy();
                  process = null;
                  stdin = null;
              }
          }
          EOF

          # 9. 写入 MainActivity.java
          cat << 'EOF' > app/src/main/java/com/mt/term/MainActivity.java
          package com.mt.term;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity implements TerminalSession.Listener {
              private static final int MAX_OUTPUT = 200_000;
              private TextView output;
              private ScrollView scroll;
              private EditText input;
              private TerminalSession session;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  output = findViewById(R.id.output);
                  scroll = findViewById(R.id.scroll);
                  input  = findViewById(R.id.input);
                  Button btnRoot  = findViewById(R.id.btnRoot);
                  Button btnSh    = findViewById(R.id.btnSh);
                  Button btnClear = findViewById(R.id.btnClear);

                  output.setText("MT 终端\n点击输入框输入命令，回车执行\n\n");
                  session = new TerminalSession(this);
                  session.start(false);
                  append("$ ");

                  input.setOnEditorActionListener((v, actionId, event) -> {
                      boolean enter = event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER && event.getAction() == KeyEvent.ACTION_DOWN;
                      if (actionId == EditorInfo.IME_ACTION_SEND || enter) {
                          String cmd = input.getText().toString();
                          input.setText("");
                          append(cmd + "\n");
                          session.write(cmd + "\n");
                          return true;
                      }
                      return false;
                  });

                  btnRoot.setOnClickListener(v -> restart(true));
                  btnSh.setOnClickListener(v -> restart(false));
                  btnClear.setOnClickListener(v -> output.setText(""));
              }

              private void restart(boolean root) {
                  session.stop();
                  session = new TerminalSession(this);
                  append("\n--- 切换 shell: " + (root ? "su" : "sh") + " ---\n");
                  if (!session.start(root)) {
                      append("回退到 sh\n");
                      session.start(false);
                  }
                  append("$ ");
              }

              private void append(String s) {
                  output.append(s);
                  CharSequence text = output.getText();
                  if (text.length() > MAX_OUTPUT) {
                      output.setText(text.subSequence(text.length() - MAX_OUTPUT / 2, text.length()));
                  }
                  scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));
              }

              @Override public void onOutput(String text) { append(text); }
              @Override public void onSessionEnd() { append("\n[进程已退出，点击上方按钮重启]\n"); }
              @Override protected void onDestroy() { super.onDestroy(); if (session != null) session.stop(); }
          }
          EOF

          echo "源码生成完毕！"

      - name: 使用下载的 Gradle 8.5 开始编译
        run: |
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: MT-Terminal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
