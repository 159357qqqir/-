name: Build APK No Checkout
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create minimal Android Gradle project
        run: |
          mkdir -p app/src/main/java/com/demo
          mkdir -p app/src/main/res/layout
          # gradle wrapper
          wget https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          wget https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.properties -P gradle/wrapper/
          chmod +x gradlew
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace "com.demo"
              compileSdk 34
              defaultConfig {
                  applicationId "com.demo"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF
          cat > app/src/main/java/com/demo/MainActivity.java <<'EOF'
          package com.demo;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {super.onCreate(b);}
          }
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
